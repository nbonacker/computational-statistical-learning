name: bias-variance-decomposition

on:
  push:
    paths:
      - '3p2-bias-variance-decomposition/**'
      - 'requirements.txt'
      - '.github/workflows/bias-variance-decomposition.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: pytest 3p2-bias-variance-decomposition

      - run: python 3p2-bias-variance-decomposition/build.py
