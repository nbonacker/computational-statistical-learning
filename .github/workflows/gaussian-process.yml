name: gaussian-process

on:
  push:
    paths:
      - '6p4-gaussian-process/**'
      - 'requirements.txt'
      - '.github/workflows/gaussian-process.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: pytest 6p4-gaussian-process

      - run: python 6p4-gaussian-process/build.py